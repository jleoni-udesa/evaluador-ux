<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%233d5afe"/><path d="M9 16.5l4.5 4.5L23 11.5" stroke="white" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<title>Evaluador UX — Leyes UX y Heurísticas de Nielsen</title>
<style>
/* ============================================================
   Tokens. El tema claro es la base; el oscuro se redefine dos
   veces: por preferencia del sistema y por elección explícita,
   para que el botón de tema gane en ambas direcciones.
   ============================================================ */
:root{
  --bg:#f5f6fb; --surface:#fff; --surface-2:#eef0f7; --surface-3:#e6e9f4;
  --border:#dee2ee; --border-2:#c6ccdf;
  --text:#111629; --muted:#59637f; --muted-2:#8892ad;
  --accent:#3d5afe; --accent-2:#5b74ff; --accent-soft:#e9ecff;
  --cumple:#0e9b6e; --cumple-soft:#e0f6ef;
  --rompe:#d64f1c; --rompe-soft:#fdeae1;
  --na:#8892ad; --na-soft:#edeff5;
  --s0:#0e9b6e; --s1:#57a86a; --s2:#d3a105; --s3:#df6317; --s4:#d12f2f;
  --shadow:0 1px 2px rgba(17,22,41,.05), 0 8px 24px -12px rgba(17,22,41,.16);
  --shadow-lg:0 12px 48px -16px rgba(17,22,41,.3);
  --radius:14px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,.7,.32,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=claro]){
    --bg:#0b0e1a; --surface:#141929; --surface-2:#1b2134; --surface-3:#232a41;
    --border:#282f47; --border-2:#3a4363;
    --text:#e8ecf8; --muted:#96a1c0; --muted-2:#6d7797;
    --accent:#7f95ff; --accent-2:#95a8ff; --accent-soft:#1c2444;
    --cumple:#38d29c; --cumple-soft:#0f3328;
    --rompe:#ff8f5e; --rompe-soft:#3a2317;
    --na:#6d7797; --na-soft:#20263a;
    --s0:#38d29c; --s1:#78cf95; --s2:#eebf46; --s3:#ff9451; --s4:#ff6a6a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 12px 48px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme=oscuro]{
  --bg:#0b0e1a; --surface:#141929; --surface-2:#1b2134; --surface-3:#232a41;
  --border:#282f47; --border-2:#3a4363;
  --text:#e8ecf8; --muted:#96a1c0; --muted-2:#6d7797;
  --accent:#7f95ff; --accent-2:#95a8ff; --accent-soft:#1c2444;
  --cumple:#38d29c; --cumple-soft:#0f3328;
  --rompe:#ff8f5e; --rompe-soft:#3a2317;
  --na:#6d7797; --na-soft:#20263a;
  --s0:#38d29c; --s1:#78cf95; --s2:#eebf46; --s3:#ff9451; --s4:#ff6a6a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 12px 48px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{letter-spacing:-.021em;margin:0;line-height:1.16}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- topbar ---------- */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--border)}
.top-in{max-width:1180px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:14px}
.brand{font-weight:700;font-size:15px;text-decoration:none;color:inherit;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand-mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;letter-spacing:-.03em}
.top-mid{display:flex;align-items:center;gap:14px;margin-left:8px}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
@media(max-width:900px){.top-mid{display:none}}

.btn{cursor:pointer;font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:9px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:7px;transition:.15s var(--ease);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{color:#fff;filter:brightness(1.07)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);border-color:transparent}
.btn-icon{padding:7px 9px}

/* anillo de progreso: estado del sistema siempre visible */
.rings{display:flex;gap:12px}
.ring{display:flex;align-items:center;gap:7px;text-decoration:none;color:inherit;padding:4px 9px 4px 4px;border-radius:99px;transition:background .15s var(--ease)}
.ring:hover{background:var(--surface-2)}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .tr{stroke:var(--surface-3)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s var(--ease)}
.ring .lab{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.15}
.ring .lab b{display:block;color:var(--text);font-variant-numeric:tabular-nums}

.saved{font-size:12.5px;color:var(--muted-2);display:flex;align-items:center;gap:6px;min-width:88px;transition:opacity .3s}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--cumple);flex:none}
.saved[data-on=false]{opacity:0}

/* ---------- landing ---------- */
.hero{padding:66px 0 4px;position:relative}
.hero::before{content:"";position:absolute;inset:-40px -20% auto;height:340px;background:radial-gradient(60% 100% at 30% 0%,var(--accent-soft),transparent 70%);z-index:-1;pointer-events:none}
.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 15px}
h1{font-size:clamp(32px,5.2vw,52px);margin-bottom:18px;letter-spacing:-.033em}
.lede{font-size:18px;color:var(--muted);max-width:58ch;margin:0 0 30px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:36px 0}
@media(max-width:760px){.cards{grid-template-columns:1fr}}
.card-link{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;transition:.2s var(--ease);box-shadow:var(--shadow);position:relative;overflow:hidden}
.card-link::after{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.card-link:hover{border-color:var(--border-2);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card-link:hover::after{transform:scaleX(1)}
.card-link .n{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.card-link h2{font-size:23px;margin:11px 0 9px}
.card-link p{color:var(--muted);font-size:14.5px;margin:0 0 20px}
.meter{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:9px}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width .6s var(--ease)}
.meter-txt{font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.card-cta{font-size:13.5px;font-weight:600;color:var(--accent);margin-top:14px;display:flex;align-items:center;gap:5px}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 26px;margin:26px 0;box-shadow:var(--shadow)}
.panel > h3{font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2);margin-bottom:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
label.f{display:block}
label.f > span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=url],input[type=date],input[type=search],textarea,select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border-2);background:var(--bg);color:var(--text);transition:.14s var(--ease)}
input:hover,textarea:hover,select:hover{border-color:var(--muted-2)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft)}
textarea{resize:vertical;min-height:80px;line-height:1.58}

/* meta: cómo la herramienta aplica lo que evalúa */
.meta-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px;background:var(--border);border-radius:10px;overflow:hidden}
.meta-list div{background:var(--surface);padding:16px 18px}
.meta-list b{display:block;font-size:13.5px;margin-bottom:3px}
.meta-list span{font-size:13px;color:var(--muted);display:block}
.meta-list em{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;display:block;margin-bottom:6px}

/* ---------- vista de formulario: índice + contenido ---------- */
.viewhead{padding:38px 0 2px}
.crumb{font-size:13.5px;color:var(--muted);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.crumb:hover{color:var(--accent)}
.viewhead h1{font-size:clamp(27px,4.2vw,38px);margin:13px 0 11px}
.viewhead p{color:var(--muted);max-width:64ch;margin:0}

.layout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:32px;align-items:start;margin-top:8px}
@media(max-width:1000px){.layout{grid-template-columns:1fr;gap:0}.idx{display:none}}

.idx{position:sticky;top:118px;max-height:calc(100vh - 140px);overflow-y:auto;padding-right:4px}
.idx h4{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2);margin:0 0 10px;font-weight:700}
.idx a{display:flex;gap:9px;align-items:center;padding:6px 9px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:13.2px;line-height:1.3;transition:.13s var(--ease)}
.idx a:hover{background:var(--surface-2);color:var(--text)}
.idx a[data-cur=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.idx .dot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--border-2);transition:.2s var(--ease)}
.idx .dot[data-st=parcial]{border-color:var(--s2);background:var(--s2);opacity:.45}
.idx .dot[data-st=listo]{border-color:transparent;background:var(--accent)}
.idx .dot[data-st=cumple]{border-color:transparent;background:var(--cumple)}
.idx .dot[data-st=rompe]{border-color:transparent;background:var(--rompe)}
.idx .dot[data-st=na]{border-color:transparent;background:var(--na)}

.toolbar{position:sticky;top:57px;z-index:40;display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:14px 0 13px;background:linear-gradient(var(--bg) 74%,transparent)}
.chip{font-size:13px;font-weight:600;padding:6px 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:.14s var(--ease)}
.chip:hover{border-color:var(--muted-2);color:var(--text)}
.chip[data-on=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.search{position:relative;flex:1;min-width:150px;max-width:260px}
.search input{padding:6px 11px 6px 30px;border-radius:99px;font-size:13.5px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2);pointer-events:none}
.count{margin-left:auto;font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums}

/* ---------- ficha ---------- */
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;scroll-margin-top:150px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.item[data-done=true]{border-color:color-mix(in srgb,var(--accent) 42%,var(--border))}
.item[data-act=true]{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.item-head{padding:21px 25px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;border-bottom:1px solid var(--border);background:linear-gradient(var(--surface),var(--surface))}
.item-head .num{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin:0 0 5px}
.item-head h3{font-size:19.5px;margin-bottom:9px}
.quote{font-size:14px;color:var(--muted);font-style:italic;margin:0;max-width:70ch}
.guia{font-size:13.5px;color:var(--muted);margin:9px 0 0;max-width:70ch;padding:9px 13px;background:var(--surface-2);border-radius:9px;border-left:3px solid var(--accent)}
.guia b{color:var(--text);font-weight:600}
.item-body{padding:21px 25px;display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px}
@media(max-width:860px){.item-body{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:17px}

.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{cursor:pointer;font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid var(--border-2);background:var(--bg);color:var(--muted);transition:.15s var(--ease)}
.seg button:hover{border-color:var(--muted);transform:translateY(-1px)}
.seg button[data-on=true]{color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.seg button[data-v=cumple][data-on=true]{background:var(--cumple)}
.seg button[data-v=rompe][data-on=true]{background:var(--rompe)}
.seg button[data-v=na][data-on=true]{background:var(--na)}
.seg button[data-s="0"][data-on=true]{background:var(--s0)}
.seg button[data-s="1"][data-on=true]{background:var(--s1)}
.seg button[data-s="2"][data-on=true]{background:var(--s2);color:#111629}
.seg button[data-s="3"][data-on=true]{background:var(--s3)}
.seg button[data-s="4"][data-on=true]{background:var(--s4)}
.seg .k{font-size:10.5px;opacity:.55;margin-left:5px;font-weight:700}

.sev-help{font-size:12.5px;color:var(--muted-2);margin:8px 0 0;min-height:19px}
.factores{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
@media(max-width:560px){.factores{grid-template-columns:1fr}}
.factores select{font-size:13.5px;padding:8px 10px}
.cc{font-size:12px;color:var(--muted-2);text-align:right;margin-top:5px;font-variant-numeric:tabular-nums}
.cc[data-over=true]{color:var(--rompe);font-weight:600}

.drop{border:1.5px dashed var(--border-2);border-radius:11px;background:var(--surface-2);padding:26px 16px;text-align:center;cursor:pointer;color:var(--muted);font-size:13.5px;transition:.16s var(--ease)}
.drop:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);transform:scale(1.015)}
.drop svg{display:block;margin:0 auto 8px;opacity:.6}
.shot{position:relative}
.shot img{width:100%;border-radius:11px;border:1px solid var(--border);display:block;cursor:zoom-in;transition:.16s var(--ease)}
.shot img:hover{border-color:var(--accent)}
.shot .rm{position:absolute;top:9px;right:9px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--border-2);background:var(--surface);cursor:pointer;opacity:0;transition:.16s var(--ease)}
.shot:hover .rm,.shot .rm:focus-visible{opacity:1}
.shot-meta{font-size:12px;color:var(--muted-2);margin-top:7px}

.lb{position:fixed;inset:0;z-index:110;background:rgba(6,9,20,.94);display:grid;place-items:center;padding:30px;animation:fade .18s var(--ease)}
.lb img{max-width:100%;max-height:88vh;border-radius:11px}
.lb-x{position:fixed;top:18px;right:20px;font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:99px;border:1px solid #444c6b;background:#151a2e;color:#e9edf8;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- resumen ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:158px 1fr 30px;gap:12px;align-items:center;font-size:13px}
.bar .t{color:var(--muted)}
.bar .track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px;transition:width .6s var(--ease)}
.bar .v{text-align:right;color:var(--muted-2);font-variant-numeric:tabular-nums}

/* ---------- toast con deshacer ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:13.5px;font-weight:600;padding:11px 14px 11px 19px;border-radius:99px;z-index:120;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px;animation:rise .22s var(--ease)}
.toast button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:99px;cursor:pointer}
.toast button:hover{background:color-mix(in srgb,var(--bg) 16%,transparent)}

/* ---------- ayuda ---------- */
.modal{position:fixed;inset:0;z-index:130;background:rgba(6,9,20,.6);display:grid;place-items:center;padding:24px;animation:fade .16s var(--ease)}
.modal-in{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:28px 30px;box-shadow:var(--shadow-lg)}
.modal-in h2{font-size:21px;margin-bottom:6px}
.modal-in > p{color:var(--muted);font-size:14.5px;margin:0 0 22px}
.modal-in h4{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2);margin:20px 0 9px}
.ks{display:flex;flex-direction:column;gap:7px}
.ks div{display:flex;justify-content:space-between;gap:16px;font-size:14px;align-items:center}
.ks span{color:var(--muted)}
kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--surface-2);border:1px solid var(--border-2);border-bottom-width:2px;border-radius:6px;padding:2.5px 7px;font-weight:600;white-space:nowrap}

/* ---------- informe ---------- */
.portada{padding:46px 0 10px;border-bottom:2px solid var(--text);margin-bottom:30px}
.portada .k{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin:0 0 13px}
.portada h1{font-size:clamp(30px,4.6vw,42px);margin-bottom:9px}
.portada .sub{font-size:17px;color:var(--muted);margin:0 0 26px}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:20px;margin-bottom:28px}
.datos div span{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-bottom:4px}
.datos div b{font-weight:600;font-size:15px}
.aviso{background:var(--rompe-soft);border:1px solid var(--rompe);color:var(--rompe);border-radius:11px;padding:15px 19px;margin:22px 0 0;font-size:14px}
.aviso > b{display:block;margin-bottom:5px}
.seccion{margin:46px 0 20px;padding-bottom:11px;border-bottom:1px solid var(--border)}
.seccion h2{font-size:25px}
.seccion p{margin:7px 0 0;color:var(--muted);font-size:14px}
.rep{border:1px solid var(--border);border-radius:12px;padding:23px 25px;margin-bottom:17px;background:var(--surface);box-shadow:var(--shadow)}
.rep-top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.rep-top h3{font-size:18.5px}
.rep .num{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin:0 0 5px}
.rep .donde{font-size:13px;color:var(--muted-2);margin:0 0 15px}
.rep-cols{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:24px;align-items:start}
@media(max-width:820px){.rep-cols{grid-template-columns:1fr}}
.rep-cols img{width:100%;border:1px solid var(--border);border-radius:9px;display:block}
.rep dl{margin:0}
.rep dt{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin:15px 0 4px}
.rep dt:first-child{margin-top:0}
.rep dd{margin:0;font-size:15px;line-height:1.62;white-space:pre-wrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap;color:#fff}
.tag[data-v=cumple]{background:var(--cumple)} .tag[data-v=rompe]{background:var(--rompe)} .tag[data-v=na]{background:var(--na)}
.tag[data-s="0"]{background:var(--s0)} .tag[data-s="1"]{background:var(--s1)}
.tag[data-s="2"]{background:var(--s2);color:#111629} .tag[data-s="3"]{background:var(--s3)} .tag[data-s="4"]{background:var(--s4)}

.vacio{text-align:center;padding:52px 24px;color:var(--muted);background:var(--surface);border:1px dashed var(--border-2);border-radius:var(--radius)}

/* ---------- impresión ---------- */
@page{size:A4;margin:16mm 14mm}
@media print{
  .top,.toolbar,.foot,.no-print,.drop,.shot .rm,.idx{display:none!important}
  html,body{background:#fff!important;color:#000!important;font-size:10.5pt}
  .wrap{max-width:none;padding:0}
  .layout{grid-template-columns:1fr}
  a{text-decoration:none;color:#000}
  .portada{padding:0 0 14px;border-bottom:2px solid #000;break-after:page}

  .portada .sub{font-size:12pt}

  .rep{break-inside:avoid;border:1px solid #bbb;border-radius:6px;padding:12px 14px;margin-bottom:10px;background:#fff;box-shadow:none}
  .rep-cols{grid-template-columns:minmax(0,1fr) 210px;gap:14px}
  .rep-cols img{border:1px solid #ccc;max-height:78mm;object-fit:contain;object-position:top}
  .rep dd{font-size:10pt;line-height:1.45}

  .tag,.bar .track i,.panel{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .tag{border:1px solid #999}
}

<body>

<header class="top no-print">
  <div class="top-in">
    <a class="brand" href="#/"><span class="brand-mark">UX</span> Evaluador UX</a>
    <div class="top-mid" id="top-rings"></div>
    <div class="top-actions">
      <span class="saved" id="saved" data-on="false"><i></i>Guardado</span>
      <button class="btn btn-ghost btn-icon" id="btn-tema" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
      <button class="btn btn-ghost btn-icon" id="btn-ayuda" title="Ayuda y atajos (?)" aria-label="Ayuda y atajos">?</button>
      <button class="btn btn-ghost" id="btn-import">Importar</button>
      <button class="btn btn-ghost" id="btn-export">Exportar</button>
      <a class="btn btn-primary" href="#/informe" id="btn-informe">Descargar PDF</a>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="foot no-print">
  <div class="wrap">
    <p style="margin:0">Todo se guarda en este navegador. Nada se envía a ningún servidor.</p>
    <p style="margin:6px 0 0">Exportá el JSON para repartir el trabajo entre el equipo y volver a unirlo. Atajos con <kbd>?</kbd>.</p>
  </div>
</footer>

<input type="file" id="file-import" accept="application/json" class="hidden">

<script>
/* ============================================================
   Criterios de evaluación
   ============================================================ */

const LEYES = [
  {id:"hick", nombre:"Ley de Hick",
   enunciado:"El tiempo que se tarda en tomar una decisión aumenta a medida que se incrementa el número de alternativas.",
   guia:"¿Cuántas opciones enfrenta la persona en este punto y cuántas necesita realmente?"},
  {id:"fitts", nombre:"Ley de Fitts",
   enunciado:"El tiempo necesario para alcanzar un objetivo depende del tamaño de ese objetivo y de la distancia hasta él.",
   guia:"¿El objetivo es lo bastante grande y está lo bastante cerca para acertarle sin esfuerzo?"},
  {id:"tesler", nombre:"Ley de Tesler",
   enunciado:"Todo proceso tiene un nivel básico de complejidad que no se puede eliminar: sólo se puede mover de un lado a otro.",
   guia:"¿Quién se queda con la complejidad que no se puede eliminar: el sistema o la persona?"},
  {id:"jakob", nombre:"Ley de Jakob",
   enunciado:"Las personas esperan que una interfaz se comporte de manera predecible, similar a las que ya usan.",
   guia:"¿Este elemento se comporta como la convención que la persona ya trae aprendida?"},
  {id:"miller", nombre:"Ley de Miller",
   enunciado:"La memoria de trabajo sostiene alrededor de siete elementos a la vez; agruparlos en bloques la alivia.",
   guia:"¿La información está agrupada en bloques manejables o hay que sostenerla toda junta?"},
  {id:"proximidad", nombre:"Ley de la Proximidad",
   enunciado:"Los objetos que se encuentran cercanos entre ellos son percibidos como un grupo.",
   guia:"¿La distancia entre los elementos comunica su relación real?"},
  {id:"similitud", nombre:"Ley de la Similitud",
   enunciado:"Los objetos con atributos similares —color, tamaño o forma— son percibidos como un grupo.",
   guia:"¿Lo que se ve parecido significa algo parecido?"},
  {id:"region", nombre:"Ley de la Región Común (Cercados)",
   enunciado:"Los objetos que están cercados o que tienen un límite a su alrededor son percibidos como un grupo.",
   guia:"¿Los límites visuales agrupan lo que conceptualmente va junto?"},
  {id:"cerramiento", nombre:"Ley del Cerramiento (Prägnanz)",
   enunciado:"Las figuras abiertas se perciben como cerradas y completas siempre que puedan interpretarse así razonablemente.",
   guia:"¿La forma más simple que la vista completa sola es la que corresponde?"},
  {id:"continuidad", nombre:"Ley de la Continuidad",
   enunciado:"Las figuras u objetos alineados se perciben como continuos y relacionados entre sí.",
   guia:"¿La alineación guía la lectura hacia donde tiene que ir?"},
  {id:"conexion", nombre:"Ley de la Conexión Uniforme",
   enunciado:"Los objetos que están conectados entre ellos son percibidos como un grupo.",
   guia:"¿Lo que está unido visualmente pertenece de verdad al mismo grupo?"},
  {id:"doherty", nombre:"Umbral de Doherty",
   enunciado:"La interacción es productiva cuando el sistema responde en menos de 400 milisegundos.",
   guia:"¿El sistema devuelve algo antes de que la persona empiece a dudar?"},
  {id:"restorff", nombre:"Efecto Von Restorff (aislamiento)",
   enunciado:"Cuando hay varios objetos similares, el que se diferencia del resto es el que se recuerda.",
   guia:"¿El elemento importante se distingue lo suficiente de los demás?"},
  {id:"serial", nombre:"Efecto de Posición Serial",
   enunciado:"Se recuerdan mejor el primer y el último elemento de una serie que los del medio.",
   guia:"¿Las posiciones fuertes de la lista están ocupadas por lo más importante?"}
];

const HEURISTICAS = [
  {id:"h1", n:1, nombre:"Visibilidad del estado del sistema",
   def:"El sistema debe mantener informada a la persona de lo que está pasando, con retroalimentación apropiada y en un tiempo razonable."},
  {id:"h2", n:2, nombre:"Correspondencia entre el sistema y el mundo real",
   def:"Hablar el lenguaje de la persona usuaria, con palabras, frases y metáforas que le resulten familiares."},
  {id:"h3", n:3, nombre:"Control y libertad del usuario",
   def:"Ofrecer salidas de emergencia claramente marcadas para deshacer y volver atrás."},
  {id:"h4", n:4, nombre:"Consistencia y estándares",
   def:"La misma palabra, situación o acción debe significar siempre lo mismo, siguiendo las convenciones de la plataforma."},
  {id:"h5", n:5, nombre:"Prevención de errores",
   def:"Es preferible evitar que el error ocurra antes que redactar un buen mensaje de error."},
  {id:"h6", n:6, nombre:"Reconocimiento antes que recuerdo",
   def:"Hacer visibles los objetos, acciones y opciones para que no haya que recordar información entre pantallas."},
  {id:"h7", n:7, nombre:"Flexibilidad y eficiencia de uso",
   def:"Ofrecer aceleradores para la persona experta sin entorpecer a la principiante."},
  {id:"h8", n:8, nombre:"Diseño estético y minimalista",
   def:"Cada unidad de información irrelevante compite con las relevantes y les resta visibilidad."},
  {id:"h9", n:9, nombre:"Ayudar a reconocer, diagnosticar y recuperarse de los errores",
   def:"Los mensajes deben estar en lenguaje llano, indicar el problema con precisión y ser constructivos."},
  {id:"h10", n:10, nombre:"Ayuda y documentación",
   def:"Cuando hace falta ayuda, tiene que ser fácil de encontrar, estar orientada a la tarea y ser breve."}
];

const SEVERIDAD = [
  {v:0, et:"No es un problema", desc:"Se cumple la heurística."},
  {v:1, et:"Cosmético",         desc:"No hace falta arreglarlo salvo que sobre tiempo."},
  {v:2, et:"Menor",             desc:"Conviene resolverlo, con prioridad baja."},
  {v:3, et:"Mayor",             desc:"Es importante, hay que resolverlo."},
  {v:4, et:"Catástrofe",        desc:"Imperativo resolverlo antes de publicar."}
];

const FACTORES = {
  frecuencia:  {et:"Frecuencia",  opts:["", "Poco frecuente", "Frecuente", "Muy frecuente"]},
  impacto:     {et:"Impacto",     opts:["", "Fácil de superar", "Difícil de superar", "Imposible de superar"]},
  persistencia:{et:"Persistencia",opts:["", "Se supera una vez", "Molesta repetidamente"]}
};

const MAX_EXPL = 320;
const CLAVE = "evaluador-ux-v1";
const CLAVE_TEMA = "evaluador-ux-tema";

/* ============================================================
   Estado
   ============================================================ */

function estadoVacio(){
  return {proyecto:{producto:"",url:"",evaluador:"",fecha:new Date().toISOString().slice(0,10)}, leyes:{}, heuristicas:{}};
}
function normalizar(p){
  const base = estadoVacio();
  return {...base, ...p, proyecto:{...base.proyecto, ...(p&&p.proyecto||{})},
          leyes:(p&&p.leyes)||{}, heuristicas:(p&&p.heuristicas)||{}};
}
let S = (()=>{ try{ const r=localStorage.getItem(CLAVE); return r?normalizar(JSON.parse(r)):estadoVacio(); }catch(e){ return estadoVacio(); } })();

let avisoCuota=false, tSaved=null;
function guardar(){
  try{
    localStorage.setItem(CLAVE, JSON.stringify(S));
    const s=document.getElementById("saved");
    if(s){ s.dataset.on="true"; clearTimeout(tSaved); tSaved=setTimeout(()=>s.dataset.on="false",1600); }
  }catch(e){
    if(!avisoCuota){ avisoCuota=true; toast("Se llenó el espacio del navegador. Exportá el JSON y sacá alguna captura.",7000); }
  }
  pintarAnillos();
}

function ley(id){ if(!S.leyes[id]) S.leyes[id]={estado:"",pantalla:"",explicacion:"",captura:""}; return S.leyes[id]; }
function heu(id){ if(!S.heuristicas[id]) S.heuristicas[id]={severidad:null,frecuencia:"",impacto:"",persistencia:"",pantalla:"",quePasa:"",porQue:"",impactoUsuario:"",captura:""}; return S.heuristicas[id]; }
function leyLista(id){ const d=ley(id); return !!(d.estado && d.explicacion.trim()); }
function heuLista(id){ const d=heu(id); return d.severidad!==null && !!(d.quePasa.trim()||d.porQue.trim()||d.impactoUsuario.trim()); }
function leyTocada(id){ const d=ley(id); return !!(d.estado||d.pantalla.trim()||d.explicacion.trim()||d.captura); }
function heuTocada(id){ const d=heu(id); return d.severidad!==null||!!(d.pantalla.trim()||d.quePasa.trim()||d.porQue.trim()||d.impactoUsuario.trim()||d.captura); }
function nLeyes(){ return LEYES.filter(l=>leyLista(l.id)).length; }
function nHeu(){ return HEURISTICAS.filter(h=>heuLista(h.id)).length; }

/* ============================================================
   Utilidades
   ============================================================ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const app = document.getElementById("app");

/* Deshacer: toda acción destructiva guarda una foto del estado
   y se puede revertir desde el aviso. */
function toast(msg, ms=2800, deshacer=null){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const d=document.createElement("div"); d.className="toast";
  d.innerHTML = `<span>${esc(msg)}</span>`;
  if(deshacer){
    const b=document.createElement("button"); b.type="button"; b.textContent="Deshacer";
    b.onclick=()=>{ d.remove(); deshacer(); };
    d.appendChild(b);
  }
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), ms);
}
function conDeshacer(msg, accion){
  const foto = JSON.stringify(S);
  accion();
  guardar(); render();
  toast(msg, 7000, ()=>{ S = normalizar(JSON.parse(foto)); guardar(); render(); toast("Listo, se deshizo"); });
}

function procesarImagen(file){
  return new Promise((res, rej)=>{
    if(!file || !file.type.startsWith("image/")) return rej(new Error("Ese archivo no es una imagen"));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("No se pudo leer el archivo"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("No se pudo abrir la imagen"));
      img.onload=()=>{
        const MAX=1600; let w=img.width, h=img.height;
        if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
        res(c.toDataURL("image/jpeg",0.82));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function pesoKB(u){ return u ? Math.round((u.length*3/4)/1024) : 0; }

/* ---------- anillos de progreso ---------- */
function anillo(pct){
  const r=13, c=2*Math.PI*r;
  return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
    <circle class="tr" cx="16" cy="16" r="${r}" fill="none" stroke-width="3.4"/>
    <circle class="fg" cx="16" cy="16" r="${r}" fill="none" stroke-width="3.4"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct)).toFixed(1)}"/></svg>`;
}
function pintarAnillos(){
  const el=document.getElementById("top-rings"); if(!el) return;
  const a=nLeyes(), b=nHeu();
  el.innerHTML = `
    <a class="ring" href="#/leyes" title="Leyes UX documentadas">${anillo(a/LEYES.length)}
      <span class="lab">Leyes<b>${a}/${LEYES.length}</b></span></a>
    <a class="ring" href="#/heuristicas" title="Heurísticas evaluadas">${anillo(b/HEURISTICAS.length)}
      <span class="lab">Heurísticas<b>${b}/${HEURISTICAS.length}</b></span></a>`;
}

/* ---------- tema ---------- */
function aplicarTema(t){
  if(t==="sistema") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem(CLAVE_TEMA, t); }catch(e){}
  const b=document.getElementById("btn-tema");
  if(b){ b.textContent = t==="claro"?"☀":t==="oscuro"?"☾":"◐"; b.title = `Tema: ${t}. Clic para cambiar.`; }
}
let temaActual = (()=>{ try{ return localStorage.getItem(CLAVE_TEMA)||"sistema"; }catch(e){ return "sistema"; } })();
aplicarTema(temaActual);

/* ============================================================
   Router
   ============================================================ */
function render(){
  const h=location.hash||"#/";
  if(h.startsWith("#/leyes")) vistaLeyes();
  else if(h.startsWith("#/heuristicas")) vistaHeuristicas();
  else if(h.startsWith("#/informe")) vistaInforme();
  else vistaInicio();
  pintarAnillos();
  if(!h.includes("#") || h==="#/") window.scrollTo(0,0);
}

/* ---------- inicio ---------- */
function vistaInicio(){
  const pl=Math.round(nLeyes()/LEYES.length*100), ph=Math.round(nHeu()/HEURISTICAS.length*100);
  app.innerHTML = `
  <div class="wrap">
    <section class="hero">
      <p class="eyebrow">Evaluación heurística de interfaces</p>
      <h1>Evaluá la interfaz de<br>cualquier app o sitio web</h1>
      <p class="lede">Dos instrumentos, uno al lado del otro: las 14 leyes UX y las 10 heurísticas de Nielsen.
      Cargá el hallazgo, la captura y el análisis de cada punto, y descargá el informe en PDF.</p>
    </section>

    <section class="panel">
      <h3>Producto evaluado</h3>
      <div class="fields">
        <label class="f"><span>Producto o app</span>
          <input type="text" id="p-producto" placeholder="Ej.: Cinépolis Argentina" value="${esc(S.proyecto.producto)}"></label>
        <label class="f"><span>URL</span>
          <input type="url" id="p-url" placeholder="https://…" value="${esc(S.proyecto.url)}"></label>
        <label class="f"><span>Equipo o evaluador</span>
          <input type="text" id="p-evaluador" placeholder="Nombres" value="${esc(S.proyecto.evaluador)}"></label>
        <label class="f"><span>Fecha</span>
          <input type="date" id="p-fecha" value="${esc(S.proyecto.fecha)}"></label>
      </div>
    </section>

    <section class="cards">
      <a class="card-link" href="#/leyes">
        <p class="n">Tablero 01</p>
        <h2>Leyes UX</h2>
        <p>Recorré las navegaciones principales usando las 14 leyes como checklist. Por cada una, indicá si el producto la cumple o la rompe.</p>
        <div class="meter"><i style="width:${pl}%"></i></div>
        <p class="meter-txt">${nLeyes()} de ${LEYES.length} documentadas</p>
        <p class="card-cta">Abrir el tablero →</p>
      </a>
      <a class="card-link" href="#/heuristicas">
        <p class="n">Tablero 02</p>
        <h2>Heurísticas de Nielsen</h2>
        <p>Las 10 heurísticas completas, puntuadas en la escala de severidad de 0 a 4. Es el estándar de una evaluación heurística real.</p>
        <div class="meter"><i style="width:${ph}%"></i></div>
        <p class="meter-txt">${nHeu()} de ${HEURISTICAS.length} evaluadas</p>
        <p class="card-cta">Abrir el tablero →</p>
      </a>
    </section>

    ${resumenHTML()}

    <section class="panel">
      <h3>Cómo esta herramienta aplica lo que evalúa</h3>
      <div class="meta-list">
        <div><em>Visibilidad del estado</em><b>Anillos de progreso y aviso de guardado</b>
          <span>Siempre se ve cuánto falta y que el trabajo quedó guardado.</span></div>
        <div><em>Control y libertad</em><b>Deshacer en vez de sólo confirmar</b>
          <span>Vaciar o quitar una captura se puede revertir durante siete segundos.</span></div>
        <div><em>Reconocer antes que recordar</em><b>El criterio siempre a la vista</b>
          <span>El enunciado de la ley y su pregunta guía acompañan mientras se escribe.</span></div>
        <div><em>Flexibilidad y eficiencia</em><b>Atajos de teclado</b>
          <span>Puntuar con <kbd>0</kbd>–<kbd>4</kbd> y recorrer con <kbd>J</kbd> / <kbd>K</kbd>.</span></div>
        <div><em>Prevención de errores</em><b>Avisa antes de entregar</b>
          <span>El informe marca si faltan heurísticas o no se llegó al piso de leyes.</span></div>
        <div><em>Ley de Fitts</em><b>Objetivos grandes y agrupados</b>
          <span>Los botones de severidad son bloques amplios, no radios diminutos.</span></div>
      </div>
    </section>
  </div>`;

  [["p-producto","producto"],["p-url","url"],["p-evaluador","evaluador"],["p-fecha","fecha"]].forEach(([el,k])=>{
    const n=document.getElementById(el);
    n.addEventListener("input", e=>{ S.proyecto[k]=e.target.value; guardar(); });
  });
}

function resumenHTML(){
  const hechas=HEURISTICAS.filter(h=>heuLista(h.id));
  if(!hechas.length) return "";
  const c=[0,0,0,0,0]; hechas.forEach(h=>c[heu(h.id).severidad]++);
  const max=Math.max.apply(null,c.concat([1]));
  const prom=(hechas.reduce((a,h)=>a+heu(h.id).severidad,0)/hechas.length).toFixed(1);
  return `<section class="panel"><h3>Resumen de severidad</h3><div class="bars">
    ${SEVERIDAD.map(s=>`<div class="bar"><span class="t">${s.v} · ${esc(s.et)}</span>
      <span class="track"><i style="width:${c[s.v]/max*100}%;background:var(--s${s.v})"></i></span>
      <span class="v">${c[s.v]}</span></div>`).join("")}
    </div><p style="margin:17px 0 0;font-size:13.5px;color:var(--muted)">Severidad media <b>${prom}</b> sobre ${hechas.length} ${hechas.length===1?"heurística evaluada":"heurísticas evaluadas"}.</p></section>`;
}

/* ============================================================
   Vistas de formulario
   ============================================================ */
let filtroLeyes="todas", filtroHeu=-1, busqueda="", itemActivo=null;

function iconoLupa(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`; }

function coincide(txt){ return !busqueda || txt.toLowerCase().includes(busqueda.toLowerCase()); }

function indiceHTML(lista, estadoDe){
  return `<nav class="idx no-print" aria-label="Índice"><h4>Índice</h4>
    ${lista.map((x,i)=>`<a href="#${x.id}" data-idx="${x.id}" data-cur="${itemActivo===x.id}">
      <i class="dot" data-st="${estadoDe(x.id)}"></i><span>${esc(x.corto||x.nombre)}</span></a>`).join("")}</nav>`;
}

function vistaLeyes(){
  const items = LEYES.filter(l=>{
    if(!coincide(l.nombre+" "+l.enunciado+" "+ley(l.id).explicacion+" "+ley(l.id).pantalla)) return false;
    if(filtroLeyes==="todas") return true;
    if(filtroLeyes==="pendientes") return !leyLista(l.id);
    return ley(l.id).estado===filtroLeyes;
  });
  const st = id => leyLista(id) ? (ley(id).estado||"listo") : (leyTocada(id)?"parcial":"");

  app.innerHTML = `

function conectarLey(id){
  const el=document.getElementById(id); if(!el) return;
  const d=ley(id);
  el.addEventListener("focusin",()=>marcarActivo(id));
  el.addEventListener("mousedown",()=>marcarActivo(id));
  el.querySelectorAll('[data-role=estado] button').forEach(b=>b.onclick=()=>setEstadoLey(id,b.dataset.v));
  el.querySelectorAll("[data-k]").forEach(c=>c.addEventListener("input",e=>{
    d[c.dataset.k]=e.target.value;
    if(c.dataset.k==="explicacion"){
      const cc=el.querySelector("[data-cc]");
      cc.textContent=`${e.target.value.length} / ${MAX_EXPL}`;
      cc.dataset.over=e.target.value.length>MAX_EXPL;
    }
    el.dataset.done=leyLista(id);
    actualizarPunto(id, leyLista(id)?(d.estado||"listo"):(leyTocada(id)?"parcial":""));
    actualizarContador();
    guardar();
  }));
  conectarCaptura(el,d,()=>vistaLeyes());
}

function setEstadoLey(id, v){

  actualizarPunto(id, leyLista(id)?(d.estado||"listo"):(leyTocada(id)?"parcial":""));

}

/* ---------- comunes a las dos vistas ---------- */
function conectarComunes(redibujar, setFiltro){
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ setFiltro(b.dataset.f); redibujar(); });
  const q=document.getElementById("q");
  if(q){
    q.addEventListener("input", e=>{
      busqueda=e.target.value; const pos=e.target.selectionStart;
      redibujar();
      const n=document.getElementById("q"); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
    });
  }
  document.querySelectorAll("[data-idx]").forEach(a=>a.addEventListener("click",()=>marcarActivo(a.dataset.idx)));
}

function marcarActivo(id){
  if(itemActivo===id) return;
  itemActivo=id;
  document.querySelectorAll(".item").forEach(i=>i.dataset.act = i.id===id);
  document.querySelectorAll("[data-idx]").forEach(a=>a.dataset.cur = a.dataset.idx===id);
}
function actualizarContador(){
  const c=document.querySelector(".count"); if(!c) return;
  c.textContent = location.hash.startsWith("#/leyes")
    ? `${nLeyes()} de ${LEYES.length} documentadas`
    : `${nHeu()} de ${HEURISTICAS.length} evaluadas`;
}
function actualizarPunto(id, st){
  const a=document.querySelector(`[data-idx="${id}"] .dot`); if(a) a.dataset.st=st;
}

/* ---------- captura ---------- */
function capturaHTML(src){
  if(src) return `<div class="shot"><img src="${src}" alt="Captura del punto analizado">
    <button class="rm no-print" data-role="quitar">Quitar</button>
    <p class="shot-meta">${pesoKB(src)} KB · clic para ampliar</p></div>`;
  return `<div class="drop" data-role="drop" tabindex="0" role="button" aria-label="Agregar captura">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>
    Arrastrá una captura acá<br>o hacé clic para elegirla</div>`;
}

function conectarCaptura(el, d, redibujar){
  const drop=el.querySelector('[data-role=drop]'), quitar=el.querySelector('[data-role=quitar]'), img=el.querySelector('.shot img');
  if(img) img.onclick=()=>lightbox(d.captura);
  if(quitar) quitar.onclick=()=>conDeshacer("Captura quitada",()=>{ d.captura=""; });
  if(drop){
    const tomar=async f=>{ try{ d.captura=await procesarImagen(f); guardar(); redibujar(); toast("Captura agregada"); }
                           catch(err){ toast(err.message||"No se pudo cargar la imagen",4500); } };
    const elegir=()=>{ const i=document.createElement("input"); i.type="file"; i.accept="image/*";
                       i.onchange=()=>{ if(i.files[0]) tomar(i.files[0]); }; i.click(); };
    drop.onclick=elegir;
    drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); elegir(); } };
    drop.ondragover=e=>{ e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave=()=>drop.classList.remove("over");
    drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove("over"); const f=e.dataTransfer.files[0]; if(f) tomar(f); };
  }
}

function lightbox(src){
  const d=document.createElement("div"); d.className="lb"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
  d.innerHTML=`<button class="lb-x">Cerrar ✕</button><img src="${src}" alt="Captura ampliada">`;
  d.onclick=()=>cerrar();
  const onKey=e=>{ if(e.key==="Escape") cerrar(); };
  function cerrar(){ d.remove(); document.removeEventListener("keydown",onKey); }
  document.addEventListener("keydown",onKey);
  document.body.appendChild(d);
}

}
document.getElementById("btn-ayuda").onclick = abrirAyuda;

/* Atajos. No se disparan mientras se escribe: la eficiencia del
   experto no puede estorbarle a quien está completando un campo. */
let secuenciaG=false;
document.addEventListener("keydown", e=>{
  const t=e.target, escribiendo = t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable);
  if(e.metaKey||e.ctrlKey||e.altKey) return;

  if(e.key==="/" && !escribiendo){ e.preventDefault(); const q=document.getElementById("q"); if(q){ q.focus(); q.select(); } return; }
  if(e.key==="?" ){ if(!escribiendo){ e.preventDefault(); abrirAyuda(); } return; }
  if(escribiendo) return;

  if(secuenciaG){
    secuenciaG=false;
    const ir={i:"#/",l:"#/leyes",h:"#/heuristicas",p:"#/informe"}[e.key.toLowerCase()];
    if(ir){ e.preventDefault(); location.hash=ir; }
    return;
  }
  if(e.key.toLowerCase()==="g"){ secuenciaG=true; setTimeout(()=>secuenciaG=false,1400); return; }

  const enLeyes=location.hash.startsWith("#/leyes"), enHeu=location.hash.startsWith("#/heuristicas");
  if(!enLeyes && !enHeu) return;
  const visibles=[...document.querySelectorAll(".item")].map(i=>i.id);
  if(!visibles.length) return;
  if(!itemActivo || visibles.indexOf(itemActivo)<0) marcarActivo(visibles[0]);

  if(e.key==="j"||e.key==="k"){
    e.preventDefault();
    const i=visibles.indexOf(itemActivo);
    const n=e.key==="j" ? Math.min(i+1,visibles.length-1) : Math.max(i-1,0);
    marcarActivo(visibles[n]);
    document.getElementById(visibles[n]).scrollIntoView({block:"start",behavior:"smooth"});
    return;
  }
  if(enHeu && /^[0-4]$/.test(e.key)){ e.preventDefault(); setSeveridad(itemActivo,+e.key); toast(`${itemActivo.toUpperCase()} · severidad ${e.key}`,1400); return; }
  if(enLeyes){
    const m={c:"cumple",r:"rompe",n:"na"}[e.key.toLowerCase()];
    if(m){ e.preventDefault(); setEstadoLey(itemActivo,m); }
  }
});

/* Marca como activa la ficha que se está mirando */
let obs=null;
function observar(){
  if(obs) obs.disconnect();
  obs=new IntersectionObserver(es=>{
    const v=es.filter(x=>x.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
    if(v) marcarActivo(v.target.id);
  },{rootMargin:"-150px 0px -55% 0px"});
  document.querySelectorAll(".item").forEach(i=>obs.observe(i));
}

const _render=render;
render=function(){ _render(); observar(); };

window.addEventListener("hashchange", ()=>{
  const h=location.hash;
  if(h && !h.startsWith("#/") && document.getElementById(h.slice(1))){ marcarActivo(h.slice(1)); return; }
  render();
});
render();
</script>
