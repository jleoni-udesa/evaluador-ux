<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluador UX — Leyes UX y Heurísticas de Nielsen</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#fff; --surface-2:#f0f2f8; --border:#dfe3ee; --border-2:#c9cfe0;
  --text:#12172a; --muted:#5c6784; --muted-2:#8a93ad;
  --accent:#3d5afe; --accent-soft:#e8ecff;
  --cumple:#0f9d70; --cumple-soft:#e2f6ef;
  --rompe:#d9541f; --rompe-soft:#fdece3;
  --na:#8a93ad; --na-soft:#eef0f5;
  --s0:#0f9d70; --s1:#4aa96c; --s2:#d9a406; --s3:#e0651a; --s4:#d32f2f;
  --radius:12px; --maxw:1080px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1020; --surface:#151a2e; --surface-2:#1c2238; --border:#2a3150; --border-2:#3a4266;
    --text:#e9edf8; --muted:#98a3c2; --muted-2:#6f7a9b;
    --accent:#7d92ff; --accent-soft:#1e2748;
    --cumple:#3ddba2; --cumple-soft:#12352a;
    --rompe:#ff8f5e; --rompe-soft:#3a2318;
    --na:#6f7a9b; --na-soft:#222840;
    --s0:#3ddba2; --s1:#7fd39a; --s2:#f0c14b; --s3:#ff9553; --s4:#ff6b6b;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{letter-spacing:-.02em;margin:0}

/* ---------- topbar ---------- */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;text-decoration:none;display:flex;align-items:center;gap:9px}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{cursor:pointer;font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.08);color:#fff}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}

/* ---------- landing ---------- */
.hero{padding:56px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 14px}
h1{font-size:clamp(30px,4.8vw,46px);line-height:1.1;margin-bottom:16px}
.lede{font-size:17.5px;color:var(--muted);max-width:60ch;margin:0 0 28px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:32px 0}
@media(max-width:740px){.cards{grid-template-columns:1fr}}
.card-link{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;transition:border-color .16s,transform .16s}
.card-link:hover{border-color:var(--accent);transform:translateY(-2px)}
.card-link .n{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.card-link h2{font-size:22px;margin:10px 0 8px}
.card-link p{color:var(--muted);font-size:14.5px;margin:0 0 18px}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:8px}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meter-txt{font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums}

/* ---------- proyecto ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin:24px 0}
.panel h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:block}
label.f > span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=url],input[type=date],textarea,select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border-2);background:var(--bg);color:var(--text)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea{resize:vertical;min-height:78px;line-height:1.55}

/* ---------- form view ---------- */
.viewhead{padding:36px 0 4px}
.viewhead .back{font-size:13.5px;color:var(--muted);text-decoration:none}
.viewhead .back:hover{color:var(--accent)}
.viewhead h1{font-size:clamp(26px,4vw,36px);margin:12px 0 10px}
.viewhead p{color:var(--muted);max-width:66ch;margin:0}
.toolbar{position:sticky;top:53px;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 0;background:linear-gradient(var(--bg) 75%,transparent)}
.chip{font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[data-on=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.count{margin-left:auto;font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums}

.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.item[data-done=true]{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.item-head{padding:20px 24px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;border-bottom:1px solid var(--border)}
.item-head .num{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-bottom:5px}
.item-head h3{font-size:19px;margin-bottom:8px}
.quote{font-size:14px;color:var(--muted);font-style:italic;margin:0;max-width:72ch}
.guia{font-size:13.5px;color:var(--muted);margin:8px 0 0;max-width:72ch}
.guia b{color:var(--text);font-weight:600}
.item-body{padding:20px 24px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
@media(max-width:820px){.item-body{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}

/* estado / severidad pickers */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{cursor:pointer;font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid var(--border-2);background:var(--bg);color:var(--muted)}
.seg button:hover{border-color:var(--muted)}
.seg button[data-on=true]{color:#fff;border-color:transparent}
.seg button[data-v=cumple][data-on=true]{background:var(--cumple)}
.seg button[data-v=rompe][data-on=true]{background:var(--rompe)}
.seg button[data-v=na][data-on=true]{background:var(--na)}
.seg button[data-s="0"][data-on=true]{background:var(--s0)}
.seg button[data-s="1"][data-on=true]{background:var(--s1)}
.seg button[data-s="2"][data-on=true]{background:var(--s2);color:#12172a}
.seg button[data-s="3"][data-on=true]{background:var(--s3)}
.seg button[data-s="4"][data-on=true]{background:var(--s4)}
.sev-help{font-size:12.5px;color:var(--muted-2);margin:7px 0 0}

.factores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.factores{grid-template-columns:1fr}}
.factores select{font-size:13.5px;padding:7px 9px}

.cc{font-size:12px;color:var(--muted-2);text-align:right;margin-top:4px;font-variant-numeric:tabular-nums}
.cc[data-over=true]{color:var(--rompe);font-weight:600}

/* captura */
.drop{border:1.5px dashed var(--border-2);border-radius:10px;background:var(--surface-2);padding:22px 16px;text-align:center;cursor:pointer;color:var(--muted);font-size:13.5px}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.shot{position:relative}
.shot img{width:100%;border-radius:10px;border:1px solid var(--border);display:block;cursor:zoom-in}
.shot .rm{position:absolute;top:8px;right:8px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--border-2);background:var(--surface);cursor:pointer}
.shot-meta{font-size:12px;color:var(--muted-2);margin-top:6px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(6,9,20,.93);display:grid;place-items:center;padding:28px}
.lb img{max-width:100%;max-height:88vh;border-radius:10px}
.lb-x{position:fixed;top:18px;right:20px;font-size:13.5px;font-weight:600;padding:8px 15px;border-radius:99px;border:1px solid #444c6b;background:#151a2e;color:#e9edf8;cursor:pointer}

/* resumen */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bar .t{color:var(--muted)}
.bar .track{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px}
.bar .v{text-align:right;color:var(--muted-2);font-variant-numeric:tabular-nums}

.foot{border-top:1px solid var(--border);margin-top:52px;padding:26px 0 44px;color:var(--muted-2);font-size:13px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:99px;z-index:120;box-shadow:0 6px 24px rgba(0,0,0,.22)}

/* impresión */
@media print{
  .top,.toolbar,.drop,.shot .rm,.btn,.no-print{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .item{break-inside:avoid;border:1px solid #bbb;margin-bottom:10px}
  .item-body{grid-template-columns:1fr 240px}
  textarea,input,select{border:none!important;padding:0!important;background:transparent!important;resize:none}
  .cc,.sev-help{display:none}
  .wrap{max-width:none;padding:0}
  a{text-decoration:none;color:#000}
}
</style>
</head>
<body>

<header class="top no-print">
  <div class="top-in">
    <a class="brand" href="#/"><span class="brand-mark">UX</span> Evaluador UX</a>
    <div class="top-actions">
      <button class="btn btn-ghost" id="btn-import">Importar</button>
      <button class="btn btn-ghost" id="btn-print">Imprimir / PDF</button>
      <button class="btn btn-ghost" id="btn-reset">Vaciar</button>
      <button class="btn btn-primary" id="btn-export">Exportar JSON</button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="foot no-print">
  <div class="wrap">
    <p style="margin:0">Herramienta de evaluación heurística. Todo se guarda en este navegador — nada se envía a ningún servidor.</p>
    <p style="margin:6px 0 0">Exportá el JSON para repartir el trabajo entre el equipo y volver a importarlo.</p>
  </div>
</footer>

<input type="file" id="file-import" accept="application/json" class="hidden">

<script>
/* ============================================================
   Datos de referencia: los criterios de evaluación
   ============================================================ */

const LEYES = [
  {id:"hick", nombre:"Ley de Hick",
   enunciado:"El tiempo que se tarda en tomar una decisión aumenta a medida que se incrementa el número de alternativas.",
   guia:"¿Cuántas opciones enfrenta la persona en este punto y cuántas necesita realmente?"},
  {id:"fitts", nombre:"Ley de Fitts",
   enunciado:"El tiempo necesario para alcanzar un objetivo depende del tamaño de ese objetivo y de la distancia hasta él.",
   guia:"¿El objetivo es lo bastante grande y está lo bastante cerca para acertarle sin esfuerzo?"},
  {id:"tesler", nombre:"Ley de Tesler",
   enunciado:"Todo proceso tiene un nivel básico de complejidad que no se puede eliminar: sólo se puede mover de un lado a otro.",
   guia:"¿Quién se queda con la complejidad que no se puede eliminar: el sistema o la persona?"},
  {id:"jakob", nombre:"Ley de Jakob",
   enunciado:"Las personas esperan que una interfaz se comporte de manera predecible, similar a las que ya usan.",
   guia:"¿Este elemento se comporta como la convención que la persona ya trae aprendida?"},
  {id:"miller", nombre:"Ley de Miller",
   enunciado:"La memoria de trabajo sostiene alrededor de siete elementos a la vez; agruparlos en bloques la alivia.",
   guia:"¿La información está agrupada en bloques manejables o hay que sostenerla toda junta?"},
  {id:"proximidad", nombre:"Ley de la Proximidad",
   enunciado:"Los objetos que se encuentran cercanos entre ellos son percibidos como un grupo.",
   guia:"¿La distancia entre los elementos comunica su relación real?"},
  {id:"similitud", nombre:"Ley de la Similitud",
   enunciado:"Los objetos con atributos similares —color, tamaño o forma— son percibidos como un grupo.",
   guia:"¿Lo que se ve parecido significa algo parecido?"},
  {id:"region", nombre:"Ley de la Región Común (Cercados)",
   enunciado:"Los objetos que están cercados o que tienen un límite a su alrededor son percibidos como un grupo.",
   guia:"¿Los límites visuales agrupan lo que conceptualmente va junto?"},
  {id:"cerramiento", nombre:"Ley del Cerramiento (Prägnanz)",
   enunciado:"Las figuras abiertas se perciben como cerradas y completas siempre que puedan interpretarse así razonablemente.",
   guia:"¿La forma más simple que la vista completa sola es la que corresponde?"},
  {id:"continuidad", nombre:"Ley de la Continuidad",
   enunciado:"Las figuras u objetos alineados se perciben como continuos y relacionados entre sí.",
   guia:"¿La alineación guía la lectura hacia donde tiene que ir?"},
  {id:"conexion", nombre:"Ley de la Conexión Uniforme",
   enunciado:"Los objetos que están conectados entre ellos son percibidos como un grupo.",
   guia:"¿Lo que está unido visualmente pertenece de verdad al mismo grupo?"},
  {id:"doherty", nombre:"Umbral de Doherty",
   enunciado:"La interacción es productiva cuando el sistema responde en menos de 400 milisegundos.",
   guia:"¿El sistema devuelve algo antes de que la persona empiece a dudar?"},
  {id:"restorff", nombre:"Efecto Von Restorff (aislamiento)",
   enunciado:"Cuando hay varios objetos similares, el que se diferencia del resto es el que se recuerda.",
   guia:"¿El elemento importante se distingue lo suficiente de los demás?"},
  {id:"serial", nombre:"Efecto de Posición Serial",
   enunciado:"Se recuerdan mejor el primer y el último elemento de una serie que los del medio.",
   guia:"¿Las posiciones fuertes de la lista están ocupadas por lo más importante?"}
];

const HEURISTICAS = [
  {id:"h1", n:1, nombre:"Visibilidad del estado del sistema",
   def:"El sistema debe mantener informada a la persona de lo que está pasando, con retroalimentación apropiada y en un tiempo razonable."},
  {id:"h2", n:2, nombre:"Correspondencia entre el sistema y el mundo real",
   def:"Hablar el lenguaje de la persona usuaria, con palabras, frases y metáforas que le resulten familiares."},
  {id:"h3", n:3, nombre:"Control y libertad del usuario",
   def:"Ofrecer salidas de emergencia claramente marcadas para deshacer y volver atrás."},
  {id:"h4", n:4, nombre:"Consistencia y estándares",
   def:"La misma palabra, situación o acción debe significar siempre lo mismo, siguiendo las convenciones de la plataforma."},
  {id:"h5", n:5, nombre:"Prevención de errores",
   def:"Es preferible evitar que el error ocurra antes que redactar un buen mensaje de error."},
  {id:"h6", n:6, nombre:"Reconocimiento antes que recuerdo",
   def:"Hacer visibles los objetos, acciones y opciones para que no haya que recordar información entre pantallas."},
  {id:"h7", n:7, nombre:"Flexibilidad y eficiencia de uso",
   def:"Ofrecer aceleradores para la persona experta sin entorpecer a la principiante."},
  {id:"h8", n:8, nombre:"Diseño estético y minimalista",
   def:"Cada unidad de información irrelevante compite con las relevantes y les resta visibilidad."},
  {id:"h9", n:9, nombre:"Ayudar a reconocer, diagnosticar y recuperarse de los errores",
   def:"Los mensajes deben estar en lenguaje llano, indicar el problema con precisión y ser constructivos."},
  {id:"h10", n:10, nombre:"Ayuda y documentación",
   def:"Cuando hace falta ayuda, tiene que ser fácil de encontrar, estar orientada a la tarea y ser breve."}
];

const SEVERIDAD = [
  {v:0, et:"No es un problema", desc:"Se cumple la heurística."},
  {v:1, et:"Cosmético",         desc:"No hace falta arreglarlo salvo que sobre tiempo."},
  {v:2, et:"Menor",             desc:"Conviene resolverlo, con prioridad baja."},
  {v:3, et:"Mayor",             desc:"Es importante, hay que resolverlo."},
  {v:4, et:"Catástrofe",        desc:"Imperativo resolverlo antes de publicar."}
];

const FACTORES = {
  frecuencia:  {et:"Frecuencia",  opts:["", "Poco frecuente", "Frecuente", "Muy frecuente"]},
  impacto:     {et:"Impacto",     opts:["", "Fácil de superar", "Difícil de superar", "Imposible de superar"]},
  persistencia:{et:"Persistencia",opts:["", "Se supera una vez", "Molesta repetidamente"]}
};

const MAX_EXPL = 320;   // 1-2 frases, como pide la consigna

/* ============================================================
   Estado
   ============================================================ */

const CLAVE = "evaluador-ux-v1";

function estadoVacio(){
  return {
    proyecto:{producto:"", url:"", evaluador:"", fecha:new Date().toISOString().slice(0,10)},
    leyes:{}, heuristicas:{}
  };
}

let S = cargar();

function cargar(){
  try{
    const raw = localStorage.getItem(CLAVE);
    if(!raw) return estadoVacio();
    const p = JSON.parse(raw);
    return {...estadoVacio(), ...p,
      proyecto:{...estadoVacio().proyecto, ...(p.proyecto||{})},
      leyes:p.leyes||{}, heuristicas:p.heuristicas||{}};
  }catch(e){ return estadoVacio(); }
}

let avisoCuota = false;
function guardar(){
  try{
    localStorage.setItem(CLAVE, JSON.stringify(S));
  }catch(e){
    if(!avisoCuota){
      avisoCuota = true;
      toast("Se llenó el espacio del navegador. Exportá el JSON y sacá alguna captura.", 6000);
    }
  }
}

function ley(id){ return S.leyes[id] ||= {estado:"", pantalla:"", explicacion:"", captura:""}; }
function heu(id){ return S.heuristicas[id] ||= {severidad:null, frecuencia:"", impacto:"", persistencia:"", pantalla:"", quePasa:"", porQue:"", impactoUsuario:"", captura:""}; }

function leyLista(id){ const d=ley(id); return !!(d.estado && d.explicacion.trim()); }
function heuLista(id){ const d=heu(id); return d.severidad!==null && !!(d.quePasa.trim()||d.porQue.trim()||d.impactoUsuario.trim()); }
function nLeyes(){ return LEYES.filter(l=>leyLista(l.id)).length; }
function nHeu(){ return HEURISTICAS.filter(h=>heuLista(h.id)).length; }

/* ============================================================
   Utilidades
   ============================================================ */

function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toast(msg, ms=2600){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const d=document.createElement("div"); d.className="toast"; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(), ms);
}

/* Reduce la imagen antes de guardarla: localStorage tiene ~5MB
   y un screenshot de pantalla completa se lo come solo. */
function procesarImagen(file){
  return new Promise((res, rej)=>{
    if(!file || !file.type.startsWith("image/")) return rej(new Error("No es una imagen"));
    const fr = new FileReader();
    fr.onerror = ()=>rej(new Error("No se pudo leer el archivo"));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>rej(new Error("No se pudo abrir la imagen"));
      img.onload = ()=>{
        const MAX = 1600;
        let {width:w, height:h} = img;
        if(w > MAX){ h = Math.round(h * MAX / w); w = MAX; }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function pesoKB(dataUrl){
  if(!dataUrl) return 0;
  return Math.round((dataUrl.length * 3/4) / 1024);
}

/* ============================================================
   Vistas
   ============================================================ */

const app = document.getElementById("app");

function render(){
  const h = location.hash || "#/";
  if(h.startsWith("#/leyes")) vistaLeyes();
  else if(h.startsWith("#/heuristicas")) vistaHeuristicas();
  else vistaInicio();
  window.scrollTo(0, 0);
}

/* ---------- inicio ---------- */
function vistaInicio(){
  const pl = Math.round(nLeyes()/LEYES.length*100);
  const ph = Math.round(nHeu()/HEURISTICAS.length*100);
  app.innerHTML = `
  <div class="wrap">
    <section class="hero">
      <p class="eyebrow">Evaluación heurística</p>
      <h1>Evaluá la interfaz de<br>cualquier app o sitio web</h1>
      <p class="lede">Dos instrumentos de evaluación: las 14 leyes UX y las 10 heurísticas de Nielsen.
      Cargá el hallazgo, la captura y el análisis de cada punto, y exportá el resultado.</p>
    </section>

    <section class="panel">
      <h3>Producto evaluado</h3>
      <div class="fields">
        <label class="f"><span>Producto o app</span>
          <input type="text" id="p-producto" placeholder="Ej.: Cinépolis Argentina" value="${esc(S.proyecto.producto)}"></label>
        <label class="f"><span>URL</span>
          <input type="url" id="p-url" placeholder="https://…" value="${esc(S.proyecto.url)}"></label>
        <label class="f"><span>Equipo o evaluador</span>
          <input type="text" id="p-evaluador" placeholder="Nombres" value="${esc(S.proyecto.evaluador)}"></label>
        <label class="f"><span>Fecha</span>
          <input type="date" id="p-fecha" value="${esc(S.proyecto.fecha)}"></label>
      </div>
    </section>

    <section class="cards">
      <a class="card-link" href="#/leyes">
        <p class="n">Tablero 01</p>
        <h2>Leyes UX</h2>
        <p>Recorré las navegaciones principales usando las 14 leyes como checklist. Por cada una, indicá si el producto la cumple o la rompe.</p>
        <div class="meter"><i style="width:${pl}%"></i></div>
        <p class="meter-txt">${nLeyes()} de ${LEYES.length} documentadas</p>
      </a>
      <a class="card-link" href="#/heuristicas">
        <p class="n">Tablero 02</p>
        <h2>Heurísticas de Nielsen</h2>
        <p>Las 10 heurísticas completas, puntuadas en la escala de severidad de 0 a 4. Es el estándar de una evaluación heurística real.</p>
        <div class="meter"><i style="width:${ph}%"></i></div>
        <p class="meter-txt">${nHeu()} de ${HEURISTICAS.length} evaluadas</p>
      </a>
    </section>

    ${resumenHTML()}
  </div>`;

  [["p-producto","producto"],["p-url","url"],["p-evaluador","evaluador"],["p-fecha","fecha"]].forEach(([el,k])=>{
    document.getElementById(el).addEventListener("input", e=>{ S.proyecto[k]=e.target.value; guardar(); });
  });
}

function resumenHTML(){
  const hechas = HEURISTICAS.filter(h=>heuLista(h.id));
  if(!hechas.length) return "";
  const conteo = [0,0,0,0,0];
  hechas.forEach(h=>{ conteo[heu(h.id).severidad]++; });
  const max = Math.max(...conteo, 1);
  const prom = (hechas.reduce((a,h)=>a+heu(h.id).severidad,0)/hechas.length).toFixed(1);
  return `
  <section class="panel">
    <h3>Resumen de severidad</h3>
    <div class="bars">
      ${SEVERIDAD.map(s=>`
      <div class="bar">
        <span class="t">${s.v} · ${esc(s.et)}</span>
        <span class="track"><i style="width:${conteo[s.v]/max*100}%;background:var(--s${s.v})"></i></span>
        <span class="v">${conteo[s.v]}</span>
      </div>`).join("")}
    </div>
    <p style="margin:16px 0 0;font-size:13.5px;color:var(--muted)">Severidad media <b>${prom}</b> sobre ${hechas.length} ${hechas.length===1?"heurística evaluada":"heurísticas evaluadas"}.</p>
  </section>`;
}

/* ---------- leyes ---------- */
let filtroLeyes = "todas";

function vistaLeyes(){
  const items = LEYES.filter(l=>{
    if(filtroLeyes==="todas") return true;
    if(filtroLeyes==="pendientes") return !leyLista(l.id);
    return ley(l.id).estado === filtroLeyes;
  });

  app.innerHTML = `
  <div class="wrap">
    <section class="viewhead">
      <a class="back no-print" href="#/">← Inicio</a>
      <h1>Tablero 01 · Leyes UX</h1>
      <p>Por cada ley: si el producto la cumple o la rompe en el punto analizado, la captura de ese punto exacto, y una explicación de 1-2 frases que responda la pregunta guía.</p>
    </section>
    <div class="toolbar no-print">
      ${[["todas",`Todas · ${LEYES.length}`],["cumple","Cumple"],["rompe","Rompe"],["pendientes",`Pendientes · ${LEYES.length-nLeyes()}`]]
        .map(([k,t])=>`<button class="chip" data-f="${k}" data-on="${filtroLeyes===k}">${t}</button>`).join("")}
      <span class="count">${nLeyes()} de ${LEYES.length} documentadas</span>
    </div>
    <div id="lista">${items.map(leyHTML).join("") || `<p style="color:var(--muted)">No hay leyes en este filtro.</p>`}</div>
  </div>`;

  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ filtroLeyes=b.dataset.f; vistaLeyes(); });
  items.forEach(l=>conectarLey(l.id));
}

function leyHTML(l){
  const d = ley(l.id);
  const idx = LEYES.findIndex(x=>x.id===l.id)+1;
  return `
  <article class="item" data-done="${leyLista(l.id)}" id="${l.id}">
    <header class="item-head">
      <div>
        <p class="num">Ley ${String(idx).padStart(2,"0")}</p>
        <h3>${esc(l.nombre)}</h3>
        <p class="quote">“${esc(l.enunciado)}”</p>
        <p class="guia"><b>Pregunta guía:</b> ${esc(l.guia)}</p>
      </div>
    </header>
    <div class="item-body">
      <div class="stack">
        <div>
          <label class="f"><span>¿Cumple o rompe?</span></label>
          <div class="seg" data-role="estado">
            <button data-v="cumple" data-on="${d.estado==="cumple"}">Cumple</button>
            <button data-v="rompe"  data-on="${d.estado==="rompe"}">Rompe</button>
            <button data-v="na"     data-on="${d.estado==="na"}">No aplica</button>
          </div>
        </div>
        <label class="f"><span>Pantalla o URL donde se observa</span>
          <input type="text" data-k="pantalla" placeholder="Ej.: Home › Cartelera" value="${esc(d.pantalla)}"></label>
        <div>
          <label class="f"><span>Explicación — qué pasa y por qué (1-2 frases)</span>
            <textarea data-k="explicacion" placeholder="Respondé la pregunta guía.">${esc(d.explicacion)}</textarea></label>
          <p class="cc" data-cc data-over="${d.explicacion.length>MAX_EXPL}">${d.explicacion.length} / ${MAX_EXPL}</p>
        </div>
      </div>
      <div>${capturaHTML(d.captura)}</div>
    </div>
  </article>`;
}

function conectarLey(id){
  const el = document.getElementById(id); if(!el) return;
  const d = ley(id);
  el.querySelectorAll('[data-role=estado] button').forEach(b=>b.onclick=()=>{
    d.estado = d.estado===b.dataset.v ? "" : b.dataset.v;
    guardar(); vistaLeyes();
    const t=document.getElementById(id); if(t) t.scrollIntoView({block:"center"});
  });
  el.querySelectorAll("[data-k]").forEach(c=>c.addEventListener("input", e=>{
    d[c.dataset.k] = e.target.value;
    if(c.dataset.k==="explicacion"){
      const cc = el.querySelector("[data-cc]");
      cc.textContent = `${e.target.value.length} / ${MAX_EXPL}`;
      cc.dataset.over = e.target.value.length > MAX_EXPL;
    }
    el.dataset.done = leyLista(id);
    guardar();
  }));
  conectarCaptura(el, d, ()=>vistaLeyes());
}

/* ---------- heurísticas ---------- */
let filtroHeu = -1;

function vistaHeuristicas(){
  const items = HEURISTICAS.filter(h=> filtroHeu<0 ? true : heu(h.id).severidad===filtroHeu);
  app.innerHTML = `
  <div class="wrap">
    <section class="viewhead">
      <a class="back no-print" href="#/">← Inicio</a>
      <h1>Tablero 02 · Heurísticas de Nielsen</h1>
      <p>Las 10 heurísticas completas, sin excepción. Por cada una: la severidad en la escala de 0 a 4, la captura del punto de dolor (o del punto donde se cumple bien), y la explicación con su impacto en la persona usuaria.</p>
    </section>
    <div class="toolbar no-print">
      <button class="chip" data-f="-1" data-on="${filtroHeu<0}">Todas · 10</button>
      ${SEVERIDAD.map(s=>`<button class="chip" data-f="${s.v}" data-on="${filtroHeu===s.v}">${s.v} · ${esc(s.et)}</button>`).join("")}
      <span class="count">${nHeu()} de ${HEURISTICAS.length} evaluadas</span>
    </div>
    <div id="lista">${items.map(heuHTML).join("") || `<p style="color:var(--muted)">No hay heurísticas con esa severidad.</p>`}</div>
  </div>`;

  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ filtroHeu=+b.dataset.f; vistaHeuristicas(); });
  items.forEach(h=>conectarHeu(h.id));
}

function heuHTML(h){
  const d = heu(h.id);
  const sev = d.severidad===null ? null : SEVERIDAD[d.severidad];
  return `
  <article class="item" data-done="${heuLista(h.id)}" id="${h.id}">
    <header class="item-head">
      <div>
        <p class="num">Heurística ${String(h.n).padStart(2,"0")}</p>
        <h3>${esc(h.nombre)}</h3>
        <p class="quote">${esc(h.def)}</p>
      </div>
    </header>
    <div class="item-body">
      <div class="stack">
        <div>
          <label class="f"><span>Severidad</span></label>
          <div class="seg" data-role="sev">
            ${SEVERIDAD.map(s=>`<button data-s="${s.v}" data-on="${d.severidad===s.v}">${s.v} · ${esc(s.et)}</button>`).join("")}
          </div>
          <p class="sev-help">${sev ? esc(sev.desc) : "Elegí un nivel para fundamentar el hallazgo."}</p>
        </div>

        <div>
          <label class="f"><span>Factores que fundamentan la severidad (opcional)</span></label>
          <div class="factores">
            ${Object.entries(FACTORES).map(([k,f])=>`
              <select data-k="${k}">
                ${f.opts.map(o=>`<option value="${esc(o)}" ${d[k]===o?"selected":""}>${o||f.et+"…"}</option>`).join("")}
              </select>`).join("")}
          </div>
        </div>

        <label class="f"><span>Pantalla o URL donde se observa</span>
          <input type="text" data-k="pantalla" placeholder="Ej.: Compra › Asientos" value="${esc(d.pantalla)}"></label>

        <label class="f"><span>Qué pasa</span>
          <textarea data-k="quePasa" placeholder="Describí el hallazgo concreto.">${esc(d.quePasa)}</textarea></label>

        <label class="f"><span>Por qué rompe o cumple la heurística</span>
          <textarea data-k="porQue" placeholder="Conectá el hallazgo con la definición de la heurística.">${esc(d.porQue)}</textarea></label>

        <label class="f"><span>Qué impacto tiene en la persona usuaria</span>
          <textarea data-k="impactoUsuario" placeholder="Qué le pasa a quien usa el producto por culpa de esto.">${esc(d.impactoUsuario)}</textarea></label>
      </div>
      <div>${capturaHTML(d.captura)}</div>
    </div>
  </article>`;
}

function conectarHeu(id){
  const el = document.getElementById(id); if(!el) return;
  const d = heu(id);
  el.querySelectorAll('[data-role=sev] button').forEach(b=>b.onclick=()=>{
    const v = +b.dataset.s;
    d.severidad = d.severidad===v ? null : v;
    guardar(); vistaHeuristicas();
    const t=document.getElementById(id); if(t) t.scrollIntoView({block:"center"});
  });
  el.querySelectorAll("[data-k]").forEach(c=>c.addEventListener("input", e=>{
    d[c.dataset.k] = e.target.value;
    el.dataset.done = heuLista(id);
    guardar();
  }));
  conectarCaptura(el, d, ()=>vistaHeuristicas());
}

/* ---------- captura ---------- */
function capturaHTML(src){
  if(src) return `
    <div class="shot">
      <img src="${src}" alt="Captura del punto analizado">
      <button class="rm no-print" data-role="quitar">Quitar</button>
      <p class="shot-meta">${pesoKB(src)} KB</p>
    </div>`;
  return `<div class="drop" data-role="drop">Arrastrá una captura acá<br>o hacé clic para elegirla</div>`;
}

function conectarCaptura(el, d, redibujar){
  const drop = el.querySelector('[data-role=drop]');
  const quitar = el.querySelector('[data-role=quitar]');
  const img = el.querySelector('.shot img');

  if(img) img.onclick = ()=>lightbox(d.captura);

  if(quitar) quitar.onclick = ()=>{ d.captura=""; guardar(); redibujar(); };

  if(drop){
    const tomar = async (file)=>{
      try{
        d.captura = await procesarImagen(file);
        guardar(); redibujar();
      }catch(err){ toast(err.message || "No se pudo cargar la imagen"); }
    };
    drop.onclick = ()=>{
      const inp = document.createElement("input");
      inp.type="file"; inp.accept="image/*";
      inp.onchange = ()=>{ if(inp.files[0]) tomar(inp.files[0]); };
      inp.click();
    };
    drop.ondragover = e=>{ e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = ()=>drop.classList.remove("over");
    drop.ondrop = e=>{
      e.preventDefault(); drop.classList.remove("over");
      const f = e.dataTransfer.files[0]; if(f) tomar(f);
    };
  }
}

function lightbox(src){
  const d = document.createElement("div");
  d.className = "lb";
  d.innerHTML = `<button class="lb-x">Cerrar ✕</button><img src="${src}" alt="Captura ampliada">`;
  d.onclick = ()=>d.remove();
  document.body.appendChild(d);
  const onKey = e=>{ if(e.key==="Escape"){ d.remove(); document.removeEventListener("keydown", onKey); } };
  document.addEventListener("keydown", onKey);
}

/* ============================================================
   Acciones globales
   ============================================================ */

document.getElementById("btn-export").onclick = ()=>{
  const nombre = (S.proyecto.producto || "evaluacion").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `evaluacion-ux-${nombre || "sin-nombre"}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("JSON exportado");
};

document.getElementById("btn-import").onclick = ()=>document.getElementById("file-import").click();
document.getElementById("file-import").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const p = JSON.parse(fr.result);
      if(typeof p!=="object" || p===null) throw new Error();
      S = {...estadoVacio(), ...p,
           proyecto:{...estadoVacio().proyecto, ...(p.proyecto||{})},
           leyes:p.leyes||{}, heuristicas:p.heuristicas||{}};
      guardar(); render(); toast("Evaluación importada");
    }catch(err){ toast("Ese archivo no es una evaluación válida"); }
  };
  fr.readAsText(f);
  e.target.value = "";
};

document.getElementById("btn-print").onclick = ()=>window.print();

document.getElementById("btn-reset").onclick = ()=>{
  if(!confirm("Esto borra toda la evaluación cargada en este navegador. ¿Seguro?\n\nSi todavía no exportaste el JSON, cancelá y exportalo primero.")) return;
  S = estadoVacio();
  localStorage.removeItem(CLAVE);
  render(); toast("Evaluación vaciada");
};

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
